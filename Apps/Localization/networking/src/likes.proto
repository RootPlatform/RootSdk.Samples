syntax = "proto3";

import "rootsdk/types.proto";

enum LikesError {
  LIKES_ERROR_UNSPECIFIED = 0;
  LIKES_ERROR_NOTHING_TO_CLEAR = 1;
}

message Likes {
  int32 count = 1;
  double last_given_at = 2;
}

message LikesGetRequest {
}

message LikesGetResponse {
  Likes likes = 1;
}

message LikesGiveRequest {
}

message LikesGiveResponse {
  Likes likes = 1;
}

message LikesClearRequest {
}

message LikesClearResponse {
  Likes likes = 1;
}

message LikesChangedEvent {
  Likes likes = 1;
}

service LikesService {
  rpc Get(LikesGetRequest) returns (LikesGetResponse);
  rpc Give(LikesGiveRequest) returns (LikesGiveResponse);
  rpc Clear(LikesClearRequest) returns (LikesClearResponse);

  rpc BroadcastChanged(LikesChangedEvent) returns (rootsdk.Void);
}
